name: Release

# Publishes the extension to the VS Code Marketplace.
#
# Triggered by pushing a version tag (v1.4.2), or run by hand from the Actions tab.
# There is deliberately no push-to-main trigger: publishing is a release act, not a
# side effect of committing.
#
# Requires a repository secret named VSCE_PAT (a Marketplace personal access token
# for the LunarWerx publisher). Without it the job stops with a clear message
# instead of failing in a confusing way half way through.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package only, do not publish'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The release's notes are its CHANGELOG.md section, never GitHub's generated notes: with no pull
      # requests those are a bare "Full Changelog" link. Checked first, so a tag with no section fails fast.
      - name: Release notes from CHANGELOG.md, and never just a link
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" 'index($0, "## [" ver "]") == 1 { grab = 1; next } grab && /^## / { exit } grab { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          words="$(sed -E 's#\[([^]]*)\]\([^)]*\)#\1#g; s#https?://[^ )>]+##g' "$RUNNER_TEMP/RELEASE_NOTES.md" \
            | grep -oiE '[a-z0-9]+' | grep -viE '^(full|changelog|what|s|changed|see|release|notes|compare|the|at|here|for|details)$' \
            | wc -l)"
          if [ "$words" -lt 5 ]; then
            echo "::error::CHANGELOG.md has no real section for $ver (a release's notes say what changed, never just a link)"
            exit 1
          fi
          cat "$RUNNER_TEMP/RELEASE_NOTES.md"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Package
        run: npx @vscode/vsce package --allow-star-activation

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Tag and package.json agree on $pkg"

      - name: Upload the .vsix as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix
          path: '*.vsix'

      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          npx @vscode/vsce publish --packagePath ./*.vsix

      - name: Attach the .vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: '*.vsix'
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
